# Builds the Android app on GitHub's computers. Nothing is published.
#
# The app's source arrives as one file, android-src.zip, beside this repository's index.html.
# Keeping it zipped means there are no folders to flatten when it is uploaded.
#
# Each run makes:
#   - a test .apk (rare-disease-tracker-apk): install it directly on an Android phone for testing;
#   - a Google Play .aab (rare-disease-tracker-play-aab): upload it in Google Play Console. It is made only when the
#     four UPLOAD_* secrets are set (Settings > Secrets and variables > Actions).
# Both are attached to the run (Actions tab > the run > Artifacts), where only you can download them.
#
# If the build fails, the full log is committed back to this repository as build-log.txt, so the
# error can be read without signing in to anything.
name: Build Android app

on:
  workflow_dispatch:
  push:
    paths:
      - "android-src.zip"
      - ".github/workflows/build-app.yml"

permissions:
  contents: write          # needed only to save build-log.txt when a build fails

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the app's source
        run: |
          unzip -q android-src.zip -d .
          echo "Unpacked. Top of the project:"
          ls android

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Put the upload key in place (only if the secrets are set)
        env:
          KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            # Spaces or line breaks picked up when pasting are removed before decoding.
            printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Upload key found: the Google Play .aab will be made."
          else
            echo "No upload key secrets: only the test .apk will be made."
          fi

      - name: Check the upload key opens (only if the secrets are set)
        if: env.UPLOAD_KEYSTORE_FILE != ''
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          # Notes go into build-log.txt too (no secret values, only their lengths), so a problem can be read there.
          LOG="$GITHUB_WORKSPACE/build-log.txt"
          PW="$(printf '%s' "$UPLOAD_KEYSTORE_PASSWORD" | tr -d ' \r\n\t')"
          KPW="$(printf '%s' "$UPLOAD_KEY_PASSWORD" | tr -d ' \r\n\t')"
          ALIAS="$(printf '%s' "${UPLOAD_KEY_ALIAS:-upload}" | tr -d ' \r\n\t')"
          {
            echo "== Upload key check =="
            echo "key file bytes: $(wc -c < "$UPLOAD_KEYSTORE_FILE")  (expected 4424)"
            echo "store password length: ${#PW}  key password length: ${#KPW}  alias: ${ALIAS}  (expected 24, 24, upload)"
            if [ "$PW" = "$KPW" ]; then echo "the two passwords match"; else echo "the two passwords DO NOT match"; fi
          } | tee -a "$LOG"
          # Re-save the key in the classic Java format with one clean password, which every Android tool reads.
          if keytool -importkeystore -noprompt -srckeystore "$UPLOAD_KEYSTORE_FILE" -srcstoretype PKCS12 \
               -srcstorepass "$PW" -srcalias "$ALIAS" -srckeypass "$PW" \
               -destkeystore "$RUNNER_TEMP/upload-clean.jks" -deststoretype JKS -deststorepass "$PW" \
               -destalias upload -destkeypass "$PW" 2>&1 | tail -3 | tee -a "$LOG"; then
            if [ -s "$RUNNER_TEMP/upload-clean.jks" ]; then
              echo "UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/upload-clean.jks" >> "$GITHUB_ENV"
              echo "UPLOAD_KEY_ALIAS_CLEAN=upload" >> "$GITHUB_ENV"
              echo "upload key opened and re-saved: OK" | tee -a "$LOG"
            fi
          fi

      - name: Build the app
        id: build
        continue-on-error: true
        working-directory: android
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          set -o pipefail
          export UPLOAD_KEY_ALIAS="${UPLOAD_KEY_ALIAS_CLEAN:-upload}"
          TASKS="assembleDebug"
          if [ -n "$UPLOAD_KEYSTORE_FILE" ]; then TASKS="assembleDebug bundleRelease"; fi
          gradle $TASKS --no-daemon --stacktrace 2>&1 | tee -a "$GITHUB_WORKSPACE/build-log.txt"

      - name: Save the log if it failed
        if: steps.build.outcome == 'failure'
        run: |
          tail -c 120000 build-log.txt > log-tail.txt && mv log-tail.txt build-log.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f build-log.txt
          git commit -m "Build log from a failed run" || exit 0
          git push origin HEAD:${{ github.ref_name }}

      - name: Attach the test .apk to this run
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: rare-disease-tracker-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 90

      - name: Attach the Google Play .aab to this run
        if: steps.build.outcome == 'success' && env.UPLOAD_KEYSTORE_FILE != ''
        uses: actions/upload-artifact@v4
        with:
          name: rare-disease-tracker-play-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 90

      - name: Report the result
        run: |
          if [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "The build failed. build-log.txt has been saved into the repository."
            exit 1
          fi
          echo "Built. Download the files under Artifacts on this run's page."
