# Builds the Android app (an .apk file) on GitHub's computers.
#
# The app's source arrives as one file, android-src.zip, sitting beside this repository's
# index.html. Keeping it zipped means there are no folders to flatten when it is uploaded.
#
# Nothing is published: the .apk is attached to this workflow run, where only you can download it.
# Start it from the Actions tab: "Build Android app" -> "Run workflow".
name: Build Android app

on:
  workflow_dispatch:        # the "Run workflow" button
  push:
    paths:
      - "android-src.zip"
      - ".github/workflows/build-app.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the app's source
        run: |
          unzip -q android-src.zip -d .
          echo "Unpacked. Top of the project:"
          ls android

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # These machines already carry the Android SDK, so nothing is installed from scratch.
      # Anything the build still needs is fetched here, and a failure is ignored so that the
      # build itself gets the chance to report what is actually missing.
      - name: Check the Android SDK that is already here
        run: |
          echo "ANDROID_HOME = $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            yes | "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi
          echo "Platforms now present:"
          ls "$ANDROID_HOME/platforms" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build the app
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Attach the .apk to this run
        uses: actions/upload-artifact@v4
        with:
          name: rare-disease-tracker-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 90
