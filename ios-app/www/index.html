,inheritance:()=>"xl",about:["XLH is an inherited condition in which a change in the PHEX gene raises the hormone FGF23, so the kidneys lose phosphate and blood phosphate stays low.","Low phosphate softens bones. In children it causes rickets, bowed legs and slow growth; in adults it can cause bone and joint pain, stiffness, small fractures, dental abscesses and hearing changes.","Treatment is burosumab, an antibody that blocks FGF23, or oral phosphate with active vitamin D. Phosphate, alkaline phosphatase and PTH help guide treatment."],categories:[{id:"bone",label:"Bone and minerals",charts:["phos","alp","pth","calcium"]},{id:"vitamins",label:"Vitamin D",charts:["vitD"]},{id:"growth",label:"Growth",charts:["heightCm"]},{id:"kidney",label:"Kidney",charts:["egfr"]},vl("Pain and how you feel"),{id:"events",label:"Fractures and dental abscesses",charts:["events"]}],labels:{pain:"Bone or joint pain (1\u201310)"},events:{title:"Something happened",chartTitle:"Fractures and dental abscesses",types:["fracture","dental"]},meds:["burosumab","xlhTrial","oralPhos","activeVitD","cinacalcet","growthHormone","custom"],trials:"X-linked hypophosphatemia",pubmed:'("X-linked hypophosphatemia"[tiab] OR "X-linked hypophosphataemia"[tiab] OR XLH[tiab])',topics:[{id:"treatment",label:"Treatments",q:"(burosumab[tiab] OR phosphate[tiab] OR calcitriol[tiab] OR treatment[tiab] OR trial[tiab])"},{id:"children",label:"Children",q:"(child*[tiab] OR rickets[tiab] OR growth[tiab])"},{id:"adults",label:"Adults",q:"(adult*[tiab] OR enthesopathy[tiab] OR osteomalacia[tiab] OR pain[tiab])"}],orgs:[{name:"XLH Network",regions:["us","eu"],color:"#1D5FA8",about:"Patient organization for people with XLH worldwide, with education, community and advocacy.",links:[{label:"Website",href:"https://xlhnetwork.org"}]},{name:"International XLH Alliance",regions:["eu","us"],color:"#1F7A5A",about:"International alliance of XLH patient groups, with resources on childhood, adult and dental XLH.",links:[{label:"Websi n, especially in males with the X-linked form and in anyone with the autosomal recessive form.","There are three forms, depending on which gene is changed and how many copies are affected. Your genetic test report says which one you have.","X-linked Alport syndrome is caused by a change in COL4A5, on the X chromosome. Males have one X, so they are usually more severely affected: kidney function often declines by early to mid adulthood, and hearing loss and eye changes are common. Females have a second, working copy, so their disease ranges from blood in the urine only to kidney failure later in life, and they still need regular checks.","Autosomal recessive Alport syndrome is caused by changes in both copies of COL4A3 or both copies of COL4A4, one inherited from each parent. Males and females are affected equally, usually as severely as males with the X-linked form, with kidney function declining in childhood or young adulthood and hearing loss common.","Autosomal dominant Alport syndrome is caused by a change in one copy of COL4A3 or COL4A4. It is usually milder and slower: blood in the urine, sometimes protein in the urine, and in some people kidney function that declines later in adulthood. Hearing and eye changes are less common. It runs from parent to child, and each child has a 1 in 2 chance of inheriting it.","There's no Alport-specific medicine yet. Starting an ACE inhibitor or ARB early slows kidney damage, and blood pressure and urine protein are watched closely."],categories:[{id:"kidney",label:"Kidney",charts:["egfr","uacr","upcr"]},{id:"hearing",label:"Hearing (audiology)",charts:["pta","hearingL","hearingR"]},bc,{id:"lipids",label:"Lipids",charts:["ldl"]}],meds:[...wl,"alportTrial","statin","dialysis","kidneyTx","custom"],trials:"Alport Syndrome",pubmed:'"alport syndrome"[tiab]',topics:[{id:"treatment",label:"Treatments",q:"(treatment[tiab] OR therapy[tiab] OR trial[tiab] OR inhibitor*[tiab])"},{id:"kidney",label:"Kidney",q:"(proteinuria[tiab] OR album al emergency number.","You use the app at your own risk, and the developers' liability is limited as far as the law allows."],sections:[{h:"1. About these terms",p:[`These terms apply to your use of ${P.name} (the "app"). "We" and "us" mean the developers of the app, ${P.developers.map(e=>e.name).join(", and ")}. By tapping "Agree and continue" or using the app, you agree to these terms. If you do not agree, do not use the app.`,"You must be 18 or older to accept these terms. A parent or legal guardian may use the app to keep a record for a child and accepts these terms on the child's behalf."]},{h:"2. Not medical advice",p:["The app is for personal record-keeping and general information only. It is not a substitute for professional medical advice, diagnosis or treatment. It has not been approved, cleared or certified as a medical device by any regulator.","Using the app does not create a doctor-patient relationship with us, including with any developer who is a physician. Do not start, stop or change any treatment based on the app. Do not delay seeking care because of anything you see in it.","The app covers several rare conditions. Information about each condition, including its tests, treatments, inheritance, patient organizations and clinical trials, is general, may be incomplete or out of date, and is not a recommendation for any person.","Reference lines on charts are general guides and may not apply to you. Clinical trial listings and articles come from third parties, are written for many audiences, and are not recommendations or endorsements."]},{h:"3. Your data and your responsibility",p:["You decide what information to enter or import, and you are responsible for its accuracy. Check results against your original lab and imaging reports.","Keep a record for another person only with that person's permission or where you have the legal authority to do so, for example as a parent or guardian. Consider using first names or initials for relatives.","The app performs automated calculations, including kidney function (eGFR) estimates, unit conversions, medicine grouping and dose tracking. These can be wrong, incomplete or unsuitable for your situation.","Your account exists only on your device. Your password locks (encrypts) your record on your device; it is never sent to us, and we cannot see, reset or recover it. When you create your account you are given a recovery code, which can replace a forgotten password. You may email the code to yourself from your own email app; we do not receive it. Keep it private, because anyone with your device and your code could open your record. If you turn on Face ID or fingerprint login, your device's own face or fingerprint check can also open your record, so anyone whose face or fingerprint is set up on your device could open it; your face and fingerprint data stay with your device and are never sent to us. If you lose both your password and your recovery code, your record cannot be opened, and you will need a backup file to restore it. Choose a password others cannot guess, and keep your device itself locked.","Your record is stored only in the browser on your device. We do not collect, receive or store it. You are responsible for keeping your device secure and for making backups. Your record can be lost if you clear your browser's data, remove the app, or lose or change your device. Once you export or share a file, you are responsible for where it goes."]},{h:"4. Sharing a copy with family",p:["The app can make a file containing a copy of a record so that you can send it to someone you choose, such as a family member. The app does not send the file. You choose how it is sent, for example by message, email or AirDrop, and the terms of that service apply. We do not receive the file.","Once you share a copy, you are responsible for it, and neither you nor we can recall it or control what the recipient does with it. The copy is not updated when the original changes. Only share with people you trust.","You can lock a shared copy with a password. If the password is lost, the file cannot be opened, and we cannot recover it. A file that is not locked can be read by anyone who has it.","The inheritance information in the app is general information, not genetic counseling or a recommendation to test any person. Talk with a care team or a genetic counselor about testing."]},{h:"5. Connecting your patient portal",p:["If the app offers a connection to your health system's patient portal (for example, one that uses Epic's FHIR interface), using it is your choice. You sign in directly with your health system, and you authorize it to send copies of your lab results and basic details to the app on your device. The connection only reads information. It does not change your medical record, and the information is not sent to us.","Your health system, Epic and other technology vendors are independent third parties. We do not control their systems, their availability or the accuracy of the information they send. Imported results may be incomplete, delayed or matched to the wrong test or unit, so review them before importing.","You can stop the connection at any time by removing the app's access in your patient portal's settings, and you can delete imported results from the app. Connecting does not make us part of your care team or a party to any agreement between you and your health system."]},{h:"6. Contacting us and other services",p:["If you send a review of the app, your star rating and comment are sent anonymously, through Google Forms, to the developers. Do not include health or personal information in a review.","If you email us, for example with a complaint or to report a problem, we receive what you write. Do not include health or personal information in an email. Email is not a secure way to send it, and the address is not monitored for medical questions.","The app links to and retrieves information from other services, such as ClinicalTrials.gov, PubMed and et:"marker-info",fallback:"info",title:"Tap the i to learn more",body:"Tap the i next to any test to see what it is, where to find the result (for example, your echocardiogram or pulmonary function test report), and whether higher or lower is usually better. For tests like the 6-minute walk, it also explains how to do them. The same i is next to each box on the Add page."},{tab:"trends",target:"marker",fallback:"charts",image:"medChart",title:"Your treatments on the charts",body:"Colored lines show your medicines: a solid line when you started, a dotted line for each dose change, and a dashed line when you stopped. Each medicine appears only on the charts it affects."},{target:"tab-add",title:"Add your lab results",body:"After each visit, enter your results here. Fill in only what you have."},{tab:"add",target:"unit-menu",fallback:"tab-add",title:"Type results in any unit",body:"If your lab report uses a different unit, pick it from the menu next to the box. The app converts it to the unit on your charts and shows the converted value before you save."},{target:"tab-meds",title:"Keep your medicines up to date",body:"Add each medicine with its starting dose. Type a name like atorvastatin or dapagliflozin and the app puts it in the right group. Whenever a dose changes, enter the new dose for that medicine right away, so your charts show exactly what you were taking."},{tab:"news",target:"learn-about",title:"The Learn page",body:"Tap Learn at the bottom of the screen anytime. It starts with a plain-language overview of your condition, to help you talk with your care team."},{tab:"news",target:"learn-support",title:"Patient support",body:"Find patient organizations and support groups for your condition, with links to their websites and communities."},{tab:"news",target:"learn-trials",title:"Clinical trials",body:"See studies for your condition from ClinicalTrials.gov. Filter to ones that are recruiting, or search by drug, sponsor or city, and ask your care team if one might fit."},{tab:"news",target:"learn-research",title:"The newest research",body:"See the latest published articles about your condition, from PubMed. Choose a topic, like treatments, to narrow the list. Only the topic is searched; your health information stays on this phone."},{target:"tab-journal",title:"Thoughts, Journal, Imagination",body:"Tap Journal to write how you're feeling, save pictures of your artwork, or write poems and song lyrics. Each entry is dated and timed, and it stays on this phone. You can also open it from the Thoughts, Journal, Imagination button on your Trends page. You are more than your disease."},{tab:"profile",target:"profile-details",title:"Your profile",body:"Tap Profile at the bottom of the screen to update your name, birth date, gene variant, or the condition this record tracks."},{tab:"profile",target:"profile-family",title:"Add a family member",body:"Keep a separate record for a child, partner or other relative on this phone, each with their own condition, charts and treatments. Once you add someone, tap the name at the top of the screen to switch between records."},{tab:"profile",target:"profile-share",title:"Share a copy with family",body:"Send a password-locked copy of a record to someone you trust, so they can see it in the app on their own phone."},{tab:"profile",target:"profile-backup",title:"Back up and export",body:"Your record is kept only on this phone, so save a locked backup now and then. You can also export a spreadsheet for your care team, or connect your MyChart to bring in lab results."},{tab:"profile",target:"profile-restore",fallback:"profile-backup",title:"Restore from a backup",body:"Got a new phone, or need to start over? Tap the button here and pick a backup file you saved. You'll need the password you locked it with. Restoring replaces what's on this phone with the backup."},{target:"settings",title:"Settings",body:"Log out, change your password, turn on Face ID, make the text bigger or the colors stronger, sw
