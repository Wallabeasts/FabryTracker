ranges from blood in the urine only to kidney failure later in life, and they still need regular checks.","Autosomal recessive Alport syndrome is caused by changes in both copies of COL4A3 or both copies of COL4A4, one inherited from each parent. Males and females are affected equally, usually as severely as males with the X-linked form, with kidney function declining in childhood or young adulthood and hearing loss common.","Autosomal dominant Alport syndrome is caused by a change in one copy of COL4A3 or COL4A4. It is usually milder and slower: blood in the urine, sometimes protein in the urine, and in some people kidney function that declines later in adulthood. Hearing and eye changes are less common. It runs from parent to child, and each child has a 1 in 2 chance of inheriting it.","There's no Alport-specific medicine yet. Starting an ACE inhibitor or ARB early slows kidney damage, and blood pressure and urine protein are watched closely."],categories:[{id:"kidney",label:"Kidney",charts:["egfr","uacr","upcr"]},{id:"hearing",label:"Hearing (audiology)",charts:["pta","hearingL","hearingR"]},pr,{id:"lipids",label:"Lipids",charts:["ldl"]}],meds:[...Gn,"alportTrial","statin","dialysis","kidneyTx","custom"],trials:"Alport Syndrome",pubmed:'"alport syndrome"[tiab]',topics:[{id:"treatment",label:"Treatments",q:"(treatment[tiab] OR therapy[tiab] OR trial[tiab] OR inhibitor*[tiab])"},{id:"kidney",label:"Kidney",q:"(proteinuria[tiab] OR albuminuria[tiab] OR kidney[tiab] OR renal[tiab])"},{id:"hearing",label:"Hearing and eyes",q:"(hearing[tiab] OR ocular[tiab] OR eye[tiab] OR lenticonus[tiab])"}],orgs:[{name:"Alport Syndrome Foundation",regions:["us"],color:"#1D5FA8",about:"U.S. nonprofit with education, a patient registry, clinical trial information, support groups and mental health resources.",links:[{label:"Website",href:"https://www.alportsyndrome.org"}]},{name:"Alport UK",regions:["eu","us"],color:"#1F7A5A",about:"Patient-led charity offering information, research up nd it does not diagnose or treat any condition.`,"You choose what to enter or import, and you are responsible for checking it. Charts and calculations, such as eGFR and unit conversions, can contain errors.","Your record stays on your device, locked with your account password. The developers do not receive, store or see it, and cannot reset or recover your password. The recovery code you keep lets you choose a new one.","If you connect a patient portal, you are asking your health system to send your results to this device.","If you keep a record for someone else or share a copy, you are responsible for having permission. Once a copy is shared, we can't control or recall it.","Always talk with your care team before making health decisions. In an emergency, call your local emergency number.","You use the app at your own risk, and the developers' liability is limited as far as the law allows."],sections:[{h:"1. About these terms",p:[`These terms apply to your use of ${j.name} (the "app"). "We" and "us" mean the developers of the app, ${j.developers.map(e=>e.name).join(", and ")}. By tapping "Agree and continue" or using the app, you agree to these terms. If you do not agree, do not use the app.`,"You must be 18 or older to accept these terms. A parent or legal guardian may use the app to keep a record for a child and accepts these terms on the child's behalf."]},{h:"2. Not medical advice",p:["The app is for personal record-keeping and general information only. It is not a substitute for professional medical advice, diagnosis or treatment. It has not been approved, cleared or certified as a medical device by any regulator.","Using the app does not create a doctor-patient relationship with us, including with any developer who is a physician. Do not start, stop or change any treatment based on the app. Do not delay seeking care because of anything you see in it.","The app covers several rare conditions. Information about each condition, including its tests, treatments, inheritance, patient organizations and clinical trials, is general, may be incomplete or out of date, and is not a recommendation for any person.","Reference lines on charts are general guides and may not apply to you. Clinical trial listings and articles come from third parties, are written for many audiences, and are not recommendations or endorsements."]},{h:"3. Your data and your responsibility",p:["You decide what information to enter or import, and you are responsible for its accuracy. Check results against your original lab and imaging reports.","Keep a record for another person only with that person's permission or where you have the legal authority to do so, for example as a parent or guardian. Consider using first names or initials for relatives.","The app performs automated calculations, including kidney function (eGFR) estimates, unit conversions, medicine grouping and dose tracking. These can be wrong, incomplete or unsuitable for your situation.","Your account exists only on your device. Your password locks (encrypts) your record on your device; it is never sent to us, and we cannot see, reset or recover it. When you create your account you are given a recovery code, which can replace a forgotten password. You may email the code to yourself from your own email app; we do not receive it. Keep it private, because anyone with your device and your code could open your record. If you turn on Face ID or fingerprint login, your device's own face or fingerprint check can also open your record, so anyone whose face or fingerprint is set up on your device could open it; your face and fingerprint data stay with your device and are never sent to us. If you lose both your password and your recovery code, your record cannot be opened, and you will need a backup file to restore it. Choose a password others cannot guess, and keep your device itself locked.","Your record is stored only in the browser on your device. We do not collect, receive or store it. You are responsible for keeping your device secure and for making backups. Your record can be lost if you clear your browser's data, remove the app, or lose or change your device. Once you export or share a file, you are responsible for where it goes."]},{h:"4. Sharing a copy with family",p:["The app can make a file containing a copy of a record so that you can send it to someone you choose, such as a family member. The app does not send the file. You choose how it is sent, for example by message, email or AirDrop, and the terms of that service apply. We do not receive the file.","Once you share a copy, you are responsible for it, and neither you nor we can recall it or control what the recipient does with it. The copy is not updated when the original changes. Only share with people you trust.","You can lock a shared copy with a password. If the password is lost, the file cannot be opened, and we cannot recover it. A file that is not locked can be read by anyone who has it.","The inheritance information in the app is general information, not genetic counseling or a recommendation to test any person. Talk with a care team or a genetic counselor about testing."]},{h:"5. Connecting your patient portal",p:["If the app offers a connection to your health system's patient portal (for example, one that uses Epic's FHIR interface), using it is your choice. You sign in directly with your health system, and you authorize it to send copies of your lab results and basic details to the app on your device. The connection only reads information. It does not change your medical record, and the information is not sent to us.","Your health system, Epic and other technology vendors are independent third parties. We do not control their systems, their availability or the accuracy of the information they send. Imported results may be incomplete, delayed or matched to the wrong test or unit, so review them before importing.","You can stop the connection at any time by removing the app's access in your patient portal's settings, and you can delete imported results from the app. Connecting does not make us part of your care team or a party to any agreement between you and your health system."]},{h:"6. Contacting us and other services",p:["If you send a review of the app, your star rating and comment are sent anonymously, through Google Forms, to the developers. Do not include health or personal information in a review.","If you email us, for example with a complaint or to report a problem, we receive what you write. Do not include health or personal information in an email. Email is not a secure way to send it, and the address is not monitored for medical questions.","The app links to and retrieves information from other services, such as ClinicalTrials.gov, PubMed and patient organizations. When it searches these services it sends only the topic you choose, not your health information. Their own terms and privacy policies apply, and we are not responsible for their content or availability."]},{h:"7. No warranties",p:['The app is provided "as is" and "as available", without warranties of any kind, whether express or implied, including warranties of accuracy, reliability, fitness for a particular purpose, merchantability, non-infringement, or uninterrupted or error-free operation.']},{h:"8. Limitation of liability",p:["To the fullest extent permitted by law, we, and any institution we are affiliated with, will not be liable for any direct, indirect, incidental, special, consequential or punitive damages, or for any loss of data, health outcome, or decision made, arising out of or related to: your use of, or inability to use, the app; information you enter, import, export or share, including copies shared with others and information about relatives; any patient portal connection; or any third-party service or content. This applies even if we have been told such damages are possible.","Where liability cannot be excluded, it is limited to the amount you paid to use the
