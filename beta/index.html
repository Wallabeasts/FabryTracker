e","Autosomal dominant"],inheritance:e=>/X-linked/.test(e)?"xl":/recessive/.test(e)?"ar":/dominant/.test(e)?"ad":"mixed",askTypeForInheritance:!0,geneByMode:{xl:"COL4A5 gene",ar:"COL4A3 or COL4A4 gene, both copies",ad:"COL4A3 or COL4A4 gene, one copy"},carrier:{label:"Carrier (one copy, often blood in the urine)",parents:"Parents are usually both carriers. People with one copy often have blood in the urine and need regular kidney checks.",info:"People with one copy often have blood in the urine, and some develop protein in the urine or kidney disease, so they need regular kidney checks."},about:["Alport syndrome is an inherited condition of type IV collagen, a building block of the kidney's filters, the inner ear and the eye. It's caused by changes in COL4A5, COL4A3 or COL4A4.","It usually starts with blood in the urine, then protein in the urine, and kidney function can decline over time. Hearing loss and eye changes are common, especially in males with the X-linked form and in anyone with the autosomal recessive form.","There are three forms, depending on which gene is changed and how many copies are affected. Your genetic test report says which one you have.","X-linked Alport syndrome is caused by a change in COL4A5, on the X chromosome. Males have one X, so they are usually more severely affected: kidney function often declines by early to mid adulthood, and hearing loss and eye changes are common. Females have a second, working copy, so their disease ranges from blood in the urine only to kidney failure later in life, and they still need regular checks.","Autosomal recessive Alport syndrome is caused by changes in both copies of COL4A3 or both copies of COL4A4, one inherited from each parent. Males and females are affected equally, usually as severely as males with the X-linked form, with kidney function declining in childhood or young adulthood and hearing loss common.","Autosomal dominant Alport syndrome is caused by a change in one copy of COL4A3 or COL4A4. It is usually milder and slower: blood in the urine, sometimes protein in the urine, and in some people kidney function that declines later in adulthood. Hearing and eye changes are less common. It runs from parent to child, and each child has a 1 in 2 chance of inheriting it.","There's no Alport-specific medicine yet. Starting an ACE inhibitor or ARB early slows kidney damage, and blood pressure and urine protein are watched closely."],categories:[{id:"kidney",label:"Kidney",charts:["egfr","uacr","upcr"]},{id:"hearing",label:"Hearing (audiology)",charts:["pta","hearingL","hearingR"]},Pr,{id:"lipids",label:"Lipids",charts:["ldl"]}],meds:[...al,"alportTrial","statin","dialysis","kidneyTx","custom"],trials:"Alport Syndrome",pubmed:'"alport syndrome"[tiab]',topics:[{id:"treatment",label:"Treatments",q:"(treatment[tiab] OR therapy[tiab] OR trial[tiab] OR inhibitor*[tiab])"},{id:"kidney",label:"Kidney",q:"(proteinuria[tiab] OR albuminuria[tiab] OR kidney[tiab] OR renal[tiab])"},{id:"hearing",label:"Hearing and eyes",q:"(hearing[tiab] OR ocular[tiab] OR eye[tiab] OR lenticonus[tiab])"}],orgs:[{name:"Alport Syndrome Foundation",regions:["us"],color:"#1D5FA8",about:"U.S. nonprofit with education, a patient registry, clinical trial information, support groups and mental health resources.",links:[{label:"Website",href:"https://www.alportsyndrome.org"}]},{name:"Alport UK",regions:["eu","us"],color:"#1F7A5A",about:"Patient-led charity offering information, research updates and practical support.",links:[{label:"Website",href:"https://www.alportuk.org"}]}],sample:{profile:{mutation:"COL4A5 c.2215G>A (p.Gly739Arg)",phenotype:"X-linked (COL4A5)",birthDate:"1998-08-14",sex:"Male"},series:{creatinine:[.95,.98,1.02,1.05,1.1,1.14,1.16,1.18,1.19],uacr:[420,460,390,310,280,240,190,175,160],upcr:[700,760,640,520,470,410,330,300,290],sbp:[138,136,132,128,126,124,122,121,120],dbp:[88,86,84,80,80,78,76,76,75],ldl:[128,131,126,120,112,98,92,88,86],hlL4000:[20,null,25,null,30,null,40,null,45] cy number.","You use the app at your own risk, and the developers' liability is limited as far as the law allows."],sections:[{h:"1. About these terms",p:[`These terms apply to your use of ${X.name} (the "app"). "We" and "us" mean the developers of the app, ${X.developers.map(e=>e.name).join(", and ")}. By tapping "Agree and continue" or using the app, you agree to these terms. If you do not agree, do not use the app.`,"You must be 18 or older to accept these terms. A parent or legal guardian may use the app to keep a record for a child and accepts these terms on the child's behalf."]},{h:"2. Not medical advice",p:["The app is for personal record-keeping and general information only. It is not a substitute for professional medical advice, diagnosis or treatment. It has not been approved, cleared or certified as a medical device by any regulator.","Using the app does not create a doctor-patient relationship with us, including with any developer who is a physician. Do not start, stop or change any treatment based on the app. Do not delay seeking care because of anything you see in it.","The app covers several rare conditions. Information about each condition, including its tests, treatments, inheritance, patient organizations and clinical trials, is general, may be incomplete or out of date, and is not a recommendation for any person.","Reference lines on charts are general guides and may not apply to you. Clinical trial listings and articles come from third parties, are written for many audiences, and are not recommendations or endorsements."]},{h:"3. Your data and your responsibility",p:["You decide what information to enter or import, and you are responsible for its accuracy. Check results against your original lab and imaging reports.","Keep a record for another person only with that person's permission or where you have the legal authority to do so, for example as a parent or guardian. Consider using first names or initials for relatives.","The app performs automated calculations, including kidney function (eGFR) estimates, unit conversions, medicine grouping and dose tracking. These can be wrong, incomplete or unsuitable for your situation.","Your account exists only on your device. Your password locks (encrypts) your record on your device; it is never sent to us, and we cannot see, reset or recover it. When you create your account you are given a recovery code, which can replace a forgotten password. You may email the code to yourself from your own email app; we do not receive it. Keep it private, because anyone with your device and your code could open your record. If you turn on Face ID or fingerprint login, your device's own face or fingerprint check can also open your record, so anyone whose face or fingerprint is set up on your device could open it; your face and fingerprint data stay with your device and are never sent to us. If you lose both your password and your recovery code, your record cannot be opened, and you will need a backup file to restore it. Choose a password others cannot guess, and keep your device itself locked.","Your record is stored only in the browser on your device. We do not collect, receive or store it. You are responsible for keeping your device secure and for making backups. Your record can be lost if you clear your browser's data, remove the app, or lose or change your device. Once you export or share a file, you are responsible for where it goes."]},{h:"4. Sharing a copy with family",p:["The app can make a file containing a copy of a record so that you can send it to someone you choose, such as a family member. The app does not send the file. You choose how it is sent, for example by message, email or AirDrop, and the terms of that service apply. We do not receive the file.","Once you share a copy, you are responsible for it, and neither you nor we can recall it or control what the recipient does with it. The copy is not updated when the original changes. Only share with people you trust.","You can lock a shared copy with a password. If the password is lost, the file cannot be opened, and we cannot recover it. A file that is not locked can be read by anyone who has it.","The inheritance information in the app is general information, not genetic counseling or a recommendation to test any person. Talk with a care team or a genetic counselor about testing."]},{h:"5. Connecting your patient portal",p:["If the app offers a connection to your health system's patient portal (for example, one that uses Epic's FHIR interface), using it is your choice. You sign in directly with your health system, and you authorize it to send copies of your lab results and basic details to the app on your device. The connection only reads information. It does not change your medical record, and the information is not sent to us.","Your health system, Epic and other technology vendors are independent third parties. We do not control their systems, their availability or the accuracy of the information they send. Imported results may be incomplete, delayed or matched to the wrong test or unit, so review them before importing.","You can stop the connection at any time by removing the app's access in your patient portal's settings, and you can delete imported results from the app. Connecting does not make us part of your care team or a party to any agreement between you and your health system."]},{h:"6. Contacting us and other services",p:["If you send a review of the app, your star rating and comment are sent anonymously, through Google Forms, to the developers. Do not include health or personal information in a review.","If you email us, for example with a complaint or to report a problem, we receive what you write. Do not include health or personal information in an email. Email is not a secure way to send it, and the address is not monitored for medical questions.","The app links to and retrieves information from other services, such as ClinicalTrials.gov, PubMed and patient organizations. When it searches these services it sends only the topic you choose, not your health information. Their own terms and privacy policies apply, and we are not responsible for their content or availability."]},{h:"7. No warranties",p:['The app is provided "as is" and "as available", without warranties of any kind, whether express or implied, including warranties of accuracy, reliability, fitness for a particular purpose, merchantability, non-infringement, or uninterrupted or error-free operation.']},{h:"8. Limitation of liability",p:["To the fullest extent permitted by law, we, and any institution we are affiliated with, will not be liable for any direct, indirect, incidental, special, consequential or punitive damages, or for any loss of data, health outcome, or decision made, arising out of or related to: your use of, or inability to use, the app; information you enter, import, export or share, including copies shared with others and information about relatives; any patient portal connection; or any third-party service or content. This applies even if we have been told such damages are possible.","Where liability cannot be excluded, it is limited to the amount you paid to use the app. The app is free."]},{h:"9. Rights the law protects",p:["Nothing in these terms excludes or limits liability that cannot be excluded or limited by law, such as liability for death or personal injury caused by negligence, or for fraud. Nothing in these terms affects rights you have as a consumer under the laws of your country, including in the European Union and the United Kingdom."]},{h:"10. Changes",p:["We may update the app, or stop offering it, at any time. If these terms change, the app will ask you to read and accept the new version before you continue."]}]};function kv(){return(0,l.jsxs)("div",{className:"text-sm",style:{color:c.ink},children:[(0,l.jsxs)("p",{className:"mb-3",style:{color:c.muted},children:["Version ",Ao.version,", effective ",Ao.effective]}),Go()!=="e
